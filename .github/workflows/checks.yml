name: Beispiele prüfen
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
env:
  PYTHONUTF8: '1'
jobs:
  examples:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.10', '3.12']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - name: Tests, Leserbefehle und Verweise prüfen
        run: python tools/check_series.py
